# Infrastructure-as-code for the Strapi backend on Render (free tier).
# Render picks this file up automatically when the repository is connected as a
# Blueprint: it creates the PostgreSQL instance, wires the connection string and
# generates the Strapi secrets.
services:
  - type: web
    name: lumea-cms
    runtime: node
    plan: free
    region: frankfurt
    rootDir: apps/cms
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /_health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_CLIENT
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: lumea-db
          property: connectionString
      - key: DATABASE_SSL
        value: 'true'
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: 'false'
      - key: APP_KEYS
        generateValue: true
      - key: API_TOKEN_SALT
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: TRANSFER_TOKEN_SALT
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      # Set to the deployed frontend origin, e.g. https://lumea.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # Optional persistent media storage — the free tier disk is ephemeral.
      - key: CLOUDINARY_NAME
        sync: false
      - key: CLOUDINARY_KEY
        sync: false
      - key: CLOUDINARY_SECRET
        sync: false

databases:
  - name: lumea-db
    plan: free
    region: frankfurt
